# Weekly `nix flake update` of every input, as a pull request that lists each
# host's package changes, new evaluation warnings, the changelogs, and each
# moved input. The workflow lives in shane/workflows, shared with homelab,
# and builds the hosts in `hydraJobs`.
on:
  schedule:
    - cron: "0 20 * * 6" # Sunday 07:00 Melbourne, an hour after homelab's
  workflow_dispatch:

concurrency:
  group: flake-update
  cancel-in-progress: true

jobs:
  update:
    uses: shane/workflows/.forgejo/workflows/flake-update.yml@v1.3.1
    with:
      notes: scripts/flake-update-notes.sh
