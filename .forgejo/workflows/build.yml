# Builds every host in `hydraJobs` on the homelab builder, whose store is the
# binary cache. A push to main also roots each build so the cache keeps it.
# The workflow lives in shane/workflows, shared with homelab.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    uses: shane/workflows/.forgejo/workflows/build.yml@v1.3.1
