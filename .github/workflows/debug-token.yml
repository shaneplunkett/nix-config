# Temporary diagnostic — checks which private inputs FLAKE_INPUTS_TOKEN
# can actually see. Prints repo names only, never the token. Delete
# after the update-flake-lock workflow is green.
name: debug-token

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe each private input with the secret
        env:
          TOKEN: ${{ secrets.FLAKE_INPUTS_TOKEN }}
        run: |
          echo "token length: ${#TOKEN}"
          echo "token prefix: ${TOKEN:0:11}"
          for repo in vex-tooling ai-skills nix-config-private noctalia-plugins; do
            result=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
              "https://api.github.com/repos/shaneplunkett/${repo}" \
              | jq -r '.full_name // .message')
            echo "${repo}: ${result}"
          done

      - name: Probe git-over-HTTPS auth forms
        env:
          TOKEN: ${{ secrets.FLAKE_INPUTS_TOKEN }}
        run: |
          for user in x-access-token oauth2 git shaneplunkett; do
            if git ls-remote "https://${user}:${TOKEN}@github.com/shaneplunkett/ai-skills.git" HEAD >/dev/null 2>&1; then
              echo "username '${user}': OK"
            else
              echo "username '${user}': FAILED"
            fi
          done
          if git ls-remote "https://${TOKEN}@github.com/shaneplunkett/ai-skills.git" HEAD >/dev/null 2>&1; then
            echo "token-as-username: OK"
          else
            echo "token-as-username: FAILED"
          fi

      - uses: DeterminateSystems/nix-installer-action@v16

      - name: Replicate the real workflow's fetch path
        env:
          TOKEN: ${{ secrets.FLAKE_INPUTS_TOKEN }}
        run: |
          nix --version
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/".insteadOf \
            "ssh://git@github.com/"
          echo "--- gitconfig keys:"
          git config --global --list | sed "s/${TOKEN}/<TOKEN>/g"
          echo "--- git ls-remote via insteadOf rewrite:"
          if git ls-remote "ssh://git@github.com/shaneplunkett/ai-skills.git" HEAD; then
            echo "git-via-insteadOf: OK"
          else
            echo "git-via-insteadOf: FAILED"
          fi
          echo "--- nix fetch of the same input:"
          if nix flake metadata "git+ssh://git@github.com/shaneplunkett/ai-skills.git" --json > /dev/null; then
            echo "nix-fetch: OK"
          else
            echo "nix-fetch: FAILED"
          fi
